<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradients & shadows -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="40%" stop-color="#151823" />
      <stop offset="100%" stop-color="#0d0f17" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>

    <!-- Mint glyph gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Film strip perforations mask/glow -->
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientDepth" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    
    <radialGradient id="innerLight" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#6ee7b7" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with Drop Shadow -->
  <g filter="url(#ambientDepth)">
    <!-- Squircle Path (macOS/KDE standard squircle formula) -->
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" />
    <!-- Ambient top spotlight -->
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#innerLight)" />
    <!-- Fine inner border -->
    <rect x="33" y="33" width="446" height="446" rx="103" ry="103" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />
  </g>

  <!-- Central Arc & Cinema Reel Fusion Geometry -->
  <g transform="translate(0, 0)">
    <!-- Ambient Mint Underglow -->
    <ellipse cx="256" cy="256" rx="110" ry="110" fill="#6ee7b7" opacity="0.12" filter="blur(28px)" />

    <!-- Exterior Dynamic Movie Arc (Filmic track) -->
    <path d="M 160 356 C 110 306 104 224 148 162 C 192 100 278 84 344 126 C 378 148 398 182 404 220" 
          fill="none" 
          stroke="url(#mintGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-dasharray="210 18 32 18 14 18"
          opacity="0.95" />

    <!-- Film Reel Segment perforations / compiler blocks along arc -->
    <g fill="#6ee7b7" opacity="0.8">
      <rect x="142" y="142" width="8" height="14" rx="3" transform="rotate(45 146 149)" />
      <rect x="186" y="106" width="8" height="14" rx="3" transform="rotate(25 190 113)" />
      <rect x="240" y="88" width="8" height="14" rx="3" transform="rotate(5 244 95)" />
      <rect x="296" y="94" width="8" height="14" rx="3" transform="rotate(-15 300 101)" />
      <rect x="348" y="122" width="8" height="14" rx="3" transform="rotate(-38 352 129)" />
    </g>

    <!-- Concentric Precision Inner Arc (Timeline Loop) -->
    <path d="M 370 274 C 362 334 314 380 252 380 C 196 380 150 342 136 292" 
          fill="none" 
          stroke="url(#mintGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.6" />

    <!-- Precision Tick Marks / Cut Points -->
    <circle cx="160" cy="356" r="5" fill="#a7f3d0" />
    <circle cx="404" cy="220" r="4" fill="#34d399" />

    <!-- Center Play/Compiler Precision Triangle Core -->
    <g filter="url(#mintGlow)">
      <!-- Triangle Glow Accent -->
      <polygon points="232,204 316,256 232,308" fill="url(#mintGrad)" />
      <!-- Subtle inner negative cut for high tech precision -->
      <circle cx="256" cy="256" r="8" fill="#151823" />
    </g>
  </g>
</svg>
